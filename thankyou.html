<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<title>신청 완료 | 시티오씨엘 9단지 오션파크뷰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#07193f;--point:#0e2a5c;--point-light:#173c7a;--accent:#ab9780;--ink:#0e2650;--muted:#6a7691}
*{margin:0;padding:0;box-sizing:border-box}
html,body{max-width:100%;overflow:hidden;height:100%}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:#f4f2ee;
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;
  position:relative;overflow:hidden}
body::before,body::after{content:"";position:absolute;border-radius:50%;z-index:0;pointer-events:none}
body::before{width:420px;height:420px;top:-140px;right:-120px;background:radial-gradient(circle,rgba(14,42,92,.12),transparent 70%)}
body::after{width:360px;height:360px;bottom:-120px;left:-120px;background:radial-gradient(circle,rgba(171,151,128,.18),transparent 70%)}
.card{position:relative;z-index:1;width:100%;max-width:420px;aspect-ratio:3 / 4;max-height:calc(100dvh - 32px);
  text-align:center;background:#fff;border:1px solid #e9e5dd;border-radius:22px;
  padding:clamp(20px,5vw,40px) clamp(18px,5vw,32px);box-shadow:0 30px 70px rgba(7,25,63,.12);
  animation:cardIn .8s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(8px,1.6vh,14px)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.brand{font-size:clamp(10px,2.8vw,12px);letter-spacing:3px;font-weight:700;color:var(--point);opacity:0;animation:fadeUp .7s ease forwards .5s}
.check-wrap{width:clamp(64px,16vw,88px);height:clamp(64px,16vw,88px);flex:0 0 auto}
.check-svg{width:100%;height:100%;display:block}
.check-circle{fill:none;stroke:var(--point);stroke-width:4;stroke-dasharray:283;stroke-dashoffset:283;animation:drawCircle .9s ease forwards .3s}
.check-mark{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;
  animation:drawMark .5s cubic-bezier(.65,0,.45,1) forwards 1s}
@keyframes drawCircle{to{stroke-dashoffset:0}}
@keyframes drawMark{to{stroke-dashoffset:0}}
h1{font-family:'Noto Serif KR',serif;font-size:clamp(20px,5.4vw,26px);font-weight:700;color:var(--navy);line-height:1.4;
  opacity:0;animation:fadeUp .7s ease forwards .9s}
.desc{color:var(--muted);font-size:clamp(13px,3.6vw,15px);line-height:1.8;opacity:0;animation:fadeUp .7s ease forwards 1.05s}
.divider{width:44px;height:2px;background:var(--accent);opacity:0;animation:fadeUp .7s ease forwards 1.15s}
.tel{font-size:clamp(12px,3.2vw,14px);color:var(--muted);opacity:0;animation:fadeUp .7s ease forwards 1.2s}
.tel b{display:block;color:var(--point);font-size:clamp(20px,5.6vw,26px);font-weight:900;margin-top:4px;letter-spacing:1px}
.btn{display:inline-block;margin-top:clamp(6px,1.4vh,12px);padding:clamp(11px,2.6vh,15px) clamp(30px,9vw,40px);border-radius:10px;
  background:linear-gradient(135deg,var(--point),var(--point-light));color:#fff;font-weight:700;font-size:clamp(13px,3.6vw,15px);
  text-decoration:none;box-shadow:0 10px 24px rgba(14,42,92,.30);transition:transform .12s ease,box-shadow .2s ease;
  opacity:0;animation:fadeUp .7s ease forwards 1.35s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(14,42,92,.40)}
.btn:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-height:560px){.card{aspect-ratio:auto;height:auto;max-height:calc(100dvh - 24px)}}
</style>
</head>
<body>
<div class="card">
  <div class="brand">CITY O CIEL 9 · OCEAN PARK VIEW</div>
  <div class="check-wrap">
    <svg class="check-svg" viewBox="0 0 100 100">
      <circle class="check-circle" cx="50" cy="50" r="45"/>
      <path class="check-mark" d="M30 51 L44 65 L71 36"/>
    </svg>
  </div>
  <h1>신청이<br>완료되었습니다</h1>
  <p class="desc">소중한 신청 감사합니다.<br>담당자가 순차적으로 연락드리겠습니다.</p>
  <div class="divider"></div>
  <p class="tel">대표문의 <b>1866-2766</b></p>
  <a class="btn" href="index.html">메인으로 돌아가기</a>
</div>
</body>
</html>
