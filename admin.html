<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>시티오씨엘 9단지 관심고객 관리</title>
<style>
  :root{--navy:#07193f;--point:#0e2a5c;--gold:#ab9780;--bg:#f4f2ee}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:#0b1f42;padding:20px}
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:20px;margin-bottom:16px}
  h1 .brand{color:var(--point)}
  h1 .sub{font-size:13px;font-weight:400;color:#77809a;margin-left:8px}
  .login{max-width:340px;margin:80px auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(7,25,63,.10);border-top:3px solid var(--gold)}
  .login h1{text-align:center}
  .login input{width:100%;padding:12px;border:1px solid #d5dae3;border-radius:8px;font-size:15px;margin:14px 0 12px}
  .login button,.tool button{background:var(--point);color:#fff;border:none;padding:12px 18px;border-radius:8px;font-size:15px;cursor:pointer;transition:background .2s}
  .login button{width:100%}
  .login button:hover,.tool button:hover{background:#173c7a}
  .hidden{display:none}
  .summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .card{background:#fff;border-radius:10px;padding:14px 18px;box-shadow:0 4px 14px rgba(7,25,63,.06);min-width:120px;border-left:3px solid var(--gold)}
  .card .n{font-size:22px;font-weight:800;color:var(--point)}
  .card .l{font-size:13px;color:#667}
  .tool{display:flex;gap:8px;margin-bottom:12px}
  .tool input{flex:1;padding:10px;border:1px solid #d5dae3;border-radius:8px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(7,25,63,.06);font-size:13px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef0e8}
  th{background:var(--navy);color:#fff;white-space:nowrap}
  tr:hover{background:#fbfaf7}
  .err{color:#c0392b;font-size:13px;margin-bottom:8px;min-height:17px}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginBox" class="login">
    <h1>관리자 로그인</h1>
    <div id="loginErr" class="err"></div>
    <input type="password" id="pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">로그인</button>
  </div>

  <div id="dashBox" class="hidden">
    <h1><span class="brand">시티오씨엘 9단지</span> 관심고객 관리 <span class="sub">총 <span id="totalCount">0</span>건</span></h1>
    <div class="summary" id="summary"></div>
    <div class="tool">
      <input type="text" id="search" placeholder="이름·연락처·유입경로 검색" oninput="renderTable()">
      <button onclick="downloadCSV()">엑셀(CSV) 저장</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>번호</th><th>등록일시</th><th>이름</th><th>연락처</th>
          <th>관심평형</th><th>유입경로</th><th>utm_source</th><th>유입페이지</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let allRows=[];

function login(){
  const pw=document.getElementById('pw').value;
  document.getElementById('loginErr').textContent='';
  fetch('/admin',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pw})
  })
  .then(r=>r.json())
  .then(res=>{
    if(!res.ok){document.getElementById('loginErr').textContent='비밀번호가 올바르지 않습니다.';return;}
    sessionStorage.setItem('adminpw',pw);
    allRows=res.rows;
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('dashBox').classList.remove('hidden');
    document.getElementById('totalCount').textContent=res.total;
    renderSummary(res.summary);
    renderTable();
  })
  .catch(()=>{document.getElementById('loginErr').textContent='오류가 발생했습니다. 다시 시도해 주세요.';});
}

function renderSummary(summary){
  const box=document.getElementById('summary');
  box.innerHTML='';
  Object.entries(summary).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{
    box.innerHTML+='<div class="card"><div class="n">'+v+'</div><div class="l">'+k+'</div></div>';
  });
}

function renderTable(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  allRows.filter(r=>{
    if(!q)return true;
    return ((r.name||'')+(r.phone||'')+(r.channel||'')).toLowerCase().includes(q);
  }).forEach(r=>{
    tbody.innerHTML+='<tr>'+
      '<td>'+r.id+'</td>'+
      '<td>'+(r.created_at||'')+'</td>'+
      '<td>'+(r.name||'')+'</td>'+
      '<td>'+(r.phone||'')+'</td>'+
      '<td>'+(r.type||'-')+'</td>'+
      '<td>'+(r.channel||'-')+'</td>'+
      '<td>'+(r.utm_source||'-')+'</td>'+
      '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(r.page_url||'')+'</td>'+
    '</tr>';
  });
}

function downloadCSV(){
  const header=['번호','등록일시','이름','연락처','관심평형','유입경로','utm_source','utm_medium','utm_campaign','referrer','유입페이지'];
  const lines=[header.join(',')];
  allRows.forEach(r=>{
    const row=[r.id,r.created_at,r.name,r.phone,r.type,r.channel,r.utm_source,r.utm_medium,r.utm_campaign,r.referrer,r.page_url]
      .map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"');
    lines.push(row.join(','));
  });
  const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='cityociel_leads_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}
</script>
</body>
</html>
